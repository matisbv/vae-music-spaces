[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pianotree-dcml"
description = "Train a PianoTree-VAE from scratch on the DCML corpora"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matis Brassard-Verrier" }]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "tensorboardX>=2.6",
    "torch>=2.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "pianotree_dcml.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
