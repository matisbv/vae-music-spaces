[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pianotree-dcml"
description = "Train a PianoTree-VAE from scratch on the DCML corpora"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matis Brassard-Verrier" }]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.scripts]
pianotree-dcml = "pianotree_dcml.cli:main"

[project.optional-dependencies]
# PyTorch comes in a CPU-only and a CUDA build: pick one with
# `uv sync --extra cpu` or `uv sync --extra cuda`.
cpu = ["torch>=2.1"]
cuda = ["torch>=2.1; sys_platform != 'darwin'"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
# CUDA 12.6 builds run on any NVIDIA driver from the CUDA 12 era or newer.
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.setuptools.dynamic]
version = { attr = "pianotree_dcml.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains a small model for about a minute (skip with -m 'not slow')"]
